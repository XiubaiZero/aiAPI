name: Daily official price update

on:
  workflow_dispatch:
  schedule:
    # 16:00 UTC is 00:00 China Standard Time (UTC+8) on the following day.
    - cron: '0 16 * * *'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run update-prices
      - run: npm run build
      - name: Commit verified official data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pricing.json src/data/exchange-rate.json
          git diff --cached --quiet || git commit -m "chore(data): verify official API prices"
          git push
